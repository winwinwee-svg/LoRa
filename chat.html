<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metastasis Chat</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --text:#1b1f24; --muted:#6b7280; --border:#e3e6ea;
  --mine:#2563eb; --mine-text:#ffffff; --theirs:#e9ecf0; --ok:#16a34a; --err:#dc2626; --accent:#2563eb;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1115; --panel:#171b21; --text:#e7e9ec; --muted:#8b94a1; --border:#262d36;
         --mine:#3b6fe0; --theirs:#232a33; --accent:#6c97f5; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:880px;height:100dvh;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--border);border-right:1px solid var(--border)}
header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:140px}
.sub{color:var(--muted);font-size:12.5px;font-weight:400}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:3px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.nodes{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;min-height:44px;align-items:center}
.node{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.empty{color:var(--muted);font-size:13px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--theirs);align-self:flex-start;word-break:break-word}
.msg.mine{background:var(--mine);color:var(--mine-text);align-self:flex-end}
.who{font-weight:600;font-size:12.5px;margin-bottom:2px;opacity:.9}
.text{white-space:pre-wrap}
.meta{font-size:11px;opacity:.75;margin-top:3px}
.msg.fail{outline:2px solid var(--err)}
.sys{align-self:center;color:var(--muted);font-size:12px;text-align:center}
form{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.row{display:flex;gap:8px}
select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0}
#sel,#to{flex:1}
#input{flex:1}
.banner{background:#fef3c7;color:#78350f;padding:8px 16px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Metastasis Chat <span class="sub">· 🔒 AES-128 · LoRa via BLE</span></h1>
    <button id="btnConnect">+ เชื่อมต่อ XIAO</button>
  </header>
  <div class="banner" id="banner">เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth — ใช้ Chrome/Edge (คอม, Android) หรือ Bluefy (iPhone)</div>
  <div class="nodes" id="nodes"><span class="empty">ยังไม่ได้เชื่อมต่อ XIAO</span></div>
  <div id="log"></div>
  <form id="form">
    <div class="row">
      <select id="sel" title="ส่งผ่าน XIAO ตัวไหน"></select>
      <input id="to" list="contacts" value="*" placeholder="ส่งถึง (* = ทุกคน)" title="ส่งถึง: ชื่อ XIAO ปลายทาง หรือ * = ทุกคน" autocomplete="off" maxlength="12">
      <datalist id="contacts"></datalist>
    </div>
    <div class="row">
      <input id="input" placeholder="พิมพ์ข้อความ…" autocomplete="off">
      <button id="btnSend" disabled>ส่ง</button>
    </div>
  </form>
</div>
<script>
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RXC = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // write  (browser -> XIAO)
const TXC = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // notify (XIAO -> browser)
const MAX_BYTES = 120, CHUNK = 20;                   // ต้องตรงกับ firmware
const enc = new TextEncoder();
const $ = id => document.getElementById(id);
const nodes = new Map();                             // dev.id -> node
const contacts = new Set(loadContacts());

if (!navigator.bluetooth) $('banner').style.display = 'block';

/* ---------- contacts (จำชื่อที่เคยได้ยิน) ---------- */
function loadContacts(){ try { return JSON.parse(localStorage.getItem('mts-contacts') || '[]'); } catch(e){ return []; } }
function saveContacts(){ try { localStorage.setItem('mts-contacts', JSON.stringify([...contacts])); } catch(e){} }
function renderContacts(){
  const dl = $('contacts'); dl.innerHTML = '';
  for (const c of ['*', ...contacts]){
    const o = document.createElement('option'); o.value = c; if (c === '*') o.label = 'ทุกคน'; dl.append(o);
  }
}
function addContact(name){
  if (!name || name === '*' || contacts.has(name)) return;
  contacts.add(name); saveContacts(); renderContacts();
}
renderContacts();

/* ---------- UI ---------- */
function time(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function addMsg({mine, who, text, meta, status}){
  const el = document.createElement('div');
  el.className = 'msg' + (mine ? ' mine' : '');
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const t = document.createElement('div'); t.className = 'text'; t.textContent = text;
  const m = document.createElement('div'); m.className = 'meta';
  el.append(w, t, m);
  el._meta = meta || ''; el._t = time();
  el._set = s => { m.textContent = [el._t, el._meta, s].filter(Boolean).join(' · '); };
  el._set(status || '');
  $('log').append(el); scroll();
  return el;
}
function fail(el, why){ el.classList.add('fail'); el._set(why); }
function sys(text){
  const el = document.createElement('div'); el.className = 'sys'; el.textContent = text;
  $('log').append(el); scroll();
}
function scroll(){ const l = $('log'); l.scrollTop = l.scrollHeight; }

function renderNodes(){
  const box = $('nodes'), sel = $('sel'), prev = sel.value;
  box.innerHTML = ''; sel.innerHTML = '';
  if (!nodes.size) box.innerHTML = '<span class="empty">ยังไม่ได้เชื่อมต่อ XIAO</span>';
  for (const [id, n] of nodes){
    const chip = document.createElement('div'); chip.className = 'node';
    chip.innerHTML = '<span class="dot"></span>'; chip.append(n.name);
    const b = document.createElement('button'); b.className = 'ghost'; b.textContent = 'ตัดการเชื่อมต่อ';
    b.onclick = () => n.dev.gatt.disconnect();
    chip.append(b); box.append(chip);
    const o = document.createElement('option'); o.value = id; o.textContent = 'ส่งจาก ' + n.name; sel.append(o);
  }
  if (nodes.has(prev)) sel.value = prev;
  $('btnSend').disabled = !nodes.size;
}

/* ---------- BLE ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));

async function connectNode(){
  let dev;
  try { dev = await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]}); }
  catch(e){ return; }
  if (nodes.has(dev.id)) { sys(dev.name + ' เชื่อมต่ออยู่แล้ว'); return; }
  try {
    let server, svc;
    for (let i = 1; i <= 3; i++){
      try { server = await dev.gatt.connect(); await wait(300); svc = await server.getPrimaryService(SVC); break; }
      catch(e){ if (i === 3) throw e; sys(`ลองเชื่อมใหม่ (${i}/3)…`); await wait(800); }
    }
    const node = { dev, name: dev.name || 'XIAO', rx: await svc.getCharacteristic(RXC),
                   pending: [], byId: new Map(), dec: new TextDecoder(), buf: '' };
    const tx = await svc.getCharacteristic(TXC);
    tx.addEventListener('characteristicvaluechanged', e => {
      node.buf += node.dec.decode(e.target.value, {stream: true});
      let i;
      while ((i = node.buf.indexOf('\n')) >= 0){
        const line = node.buf.slice(0, i); node.buf = node.buf.slice(i + 1);
        if (line) onLine(node, line);
      }
    });
    dev.addEventListener('gattserverdisconnected', () => {
      nodes.delete(dev.id); renderNodes(); sys(node.name + ' หลุดการเชื่อมต่อ');
      [...node.pending, ...node.byId.values()].forEach(el => fail(el, 'ไม่ทราบผล (BLE หลุด)'));
    });
    nodes.set(dev.id, node); renderNodes();
    await tx.startNotifications();
    sys('เชื่อมต่อ ' + node.name + ' แล้ว');
  } catch(e){ sys('เชื่อมต่อไม่สำเร็จ: ' + e.message); }
}

function onLine(node, line){
  const p = line.split('|');
  const byId = id => node.byId.get(id);
  switch (p[0]){
    case 'ME':
      node.name = p.slice(1).join('|') || node.name; renderNodes(); break;
    case 'Q': {                                       // firmware รับข้อความ + ให้ id
      const el = node.pending.shift(); if (!el) break;
      node.byId.set(p[1], el); el._set('กำลังเข้ารหัส/ส่ง…'); break;
    }
    case 'ERR': {                                     // firmware ไม่รับข้อความ
      const el = node.pending.shift(); if (el) fail(el, 'บอร์ดไม่รับ (code ' + p[1] + ')'); break;
    }
    case 'TX': {
      const el = byId(p[2]); if (!el) break;
      if (p[1] === 'OK'){
        if (el._direct) el._set('ส่งแล้ว · รอตอบรับ…');
        else { el._set('ส่งออกแล้ว ✓'); node.byId.delete(p[2]); }
      } else { fail(el, 'ส่งไม่สำเร็จ (code ' + p[3] + ')'); node.byId.delete(p[2]); }
      break;
    }
    case 'RETRY': { const el = byId(p[1]); if (el) el._set(`ส่งซ้ำ ${p[2]}/3…`); break; }
    case 'ACK':   { const el = byId(p[1]); if (el){ el._set('ถึงแล้ว ✓✓'); node.byId.delete(p[1]); } break; }
    case 'NOACK': { const el = byId(p[1]); if (el){ fail(el, 'ไม่ได้รับการตอบรับ'); node.byId.delete(p[1]); } break; }
    case 'RX':
      if (p.length >= 6){
        const snr = p.pop(), rssi = p.pop(), from = p[1], to = p[2], text = p.slice(3).join('|');
        addContact(from);
        addMsg({mine:false, who: from + (to === '*' ? '' : ' · 🔒 ส่วนตัว'), text,
                meta:`RSSI ${rssi} · SNR ${snr} · ผ่าน ${node.name}`});
      }
      break;
  }
}

async function send(ev){
  ev.preventDefault();
  const text = $('input').value.replace(/[\r\n]/g, ' ').trim(); if (!text) return;
  const to = ($('to').value.trim() || '*').replace(/[|\r\n]/g, '');
  const node = nodes.get($('sel').value);
  if (!node){ sys('เชื่อมต่อ XIAO ก่อน'); return; }
  if (enc.encode(text).length > MAX_BYTES){ sys(`ข้อความยาวเกิน ${MAX_BYTES} bytes — ภาษาไทย ~3 bytes/ตัว`); return; }
  if (enc.encode(to).length > 12){ sys('ชื่อผู้รับยาวเกิน 12 ตัวอักษร'); return; }
  if (to === node.name){ sys('ส่งหาตัวเองไม่ได้'); return; }
  if (to !== '*') addContact(to);
  const el = addMsg({mine:true, who: node.name + ' → ' + (to === '*' ? 'ทุกคน' : to), text, status:'กำลังส่ง…'});
  el._direct = to !== '*';
  node.pending.push(el); $('input').value = '';
  try {
    const all = enc.encode(to + '|' + text + '\n');
    for (let o = 0; o < all.length; o += CHUNK){
      const part = all.slice(o, o + CHUNK);
      if (node.rx.writeValueWithResponse) await node.rx.writeValueWithResponse(part);
      else await node.rx.writeValue(part);
    }
  } catch(e){
    node.pending = node.pending.filter(x => x !== el);
    fail(el, 'เขียนไป XIAO ไม่ได้: ' + e.message);
  }
}

$('btnConnect').onclick = connectNode;
$('form').onsubmit = send;
</script>
</body>
</html>
